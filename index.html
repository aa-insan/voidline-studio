<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Warna bilah browser di ponsel: sama dengan dinding situs (#0a0a0b),
         bukan putih — situs ini hitam dari ujung ke ujung. -->
    <meta name="theme-color" content="#0a0a0b" />

    <!--
      META DASAR — dibaca mesin pencari dan, yang lebih penting, pratinjau
      tautan di Discord/X/WhatsApp. Peramban pratinjau itu TIDAK menjalankan
      JavaScript, jadi satu-satunya teks yang mereka lihat adalah yang tertulis
      di sini. Isi halaman yang dirender React tidak akan pernah sampai ke
      mereka. Karena itu judul, deskripsi, dan gambar di bawah harus lengkap
      tanpa bantuan kode.

      Judul dan deskripsi per halaman diubah saat runtime oleh
      `useDocumentMeta` (src/i18n/useDocumentMeta.ts) untuk mesin pencari;
      nilai di sini adalah versi beranda sekaligus cadangan bagi pratinjau.
    -->
    <title>Voidline Iceland — Hand-drawn NFT Collections on XRP Ledger</title>
    <meta
      name="description"
      content="Voidline Iceland is an independent art studio building hand-drawn NFT collections on the XRP Ledger — plus a browser-based generator that turns your layer folders into mint-ready artwork and metadata."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://voidlineiceland.com/" />

    <!-- OpenGraph — Facebook, Discord, WhatsApp, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Voidline Iceland" />
    <meta property="og:url" content="https://voidlineiceland.com/" />
    <meta
      property="og:title"
      content="Voidline Iceland — Hand-drawn NFT Collections on XRP Ledger"
    />
    <meta
      property="og:description"
      content="Independent art studio. Hand-drawn NFT collections on the XRP Ledger, and a browser-based generator for creators."
    />
    <!-- Gambar statis: 1200×630 JPG/PNG di public/. GIF logo 20 MB tidak layak
         dijadikan og:image — banyak peramban pratinjau menolak atau memotongnya. -->
    <meta property="og:image" content="https://voidlineiceland.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Voidline Iceland — red, black, and white." />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Voidline Iceland — Hand-drawn NFT Collections on XRP Ledger"
    />
    <meta
      name="twitter:description"
      content="Independent art studio. Hand-drawn NFT collections on the XRP Ledger, and a browser-based generator for creators."
    />
    <meta name="twitter:image" content="https://voidlineiceland.com/og-image.png" />

    <!--
      FONT — dua jenis, masing-masing punya tugas.

      Cinzel  : judul dan angka besar. Bentuknya geometris dengan tarikan tebal
                tipis yang tajam — inilah wajah "gothic" yang cocok untuk brand
                merah–hitam–putih: tegas dan berkelas.
      Inter   : seluruh teks isi. Cinzel tidak layak untuk paragraf — huruf
                kecilnya sempit dan cepat melelahkan mata. Inter menjaga
                keterbacaan, dan pasangan keduanya terbaca sebagai satu
                rancangan, bukan dua gaya yang bertabrakan.

      preconnect dipakai supaya koneksi ke server font sudah dibuka sebelum
      CSS-nya diminta, sehingga teks tidak berkedip berganti rupa.

      Bila jaringan font gagal, situs tetap memakai font sistem (lihat
      index.css) — halaman tidak rusak, hanya berganti wajah.

      WEIGHT — hanya yang benar-benar dipakai kode, supaya permintaan lebih
      ringan dan render tidak tertahan memuat wajah yang tak pernah tampil:
        Cinzel  400 (angka/menu kecil tanpa weight), 600, 700 — 900 tak dipakai
        Inter   400 (isi), 500 (font-medium), 600 (font-semibold, tombol)
                — 700 tak dipakai: semua font-bold di kode berpasangan dengan
                font-display (Cinzel), bukan Inter
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
